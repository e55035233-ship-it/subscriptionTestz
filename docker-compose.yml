

services:
  postgres:
    image: postgres:16
    container_name: subscriptions_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: subscriptions
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: subscriptions_app
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: subscriptions
      DB_PORT: 5432
      DB_SSLMODE: disable